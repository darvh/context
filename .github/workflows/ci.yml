name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test

      - name: Build standalone binary
        run: bun run build

      - name: Verify packaged artifact
        run: |
          test -x dist/context
          test -f dist/grammars/tree-sitter-go/tree-sitter-go.wasm
          test -f dist/grammars/web-tree-sitter/tree-sitter.wasm
          ./dist/context --help >/dev/null
          # real parse exercises grammar discovery + wasm init (--help does not)
          cp -R spike/fixtures/multilang /tmp/ml && ./dist/context prepare "MyClass" --root /tmp/ml >/dev/null
