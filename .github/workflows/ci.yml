name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate large-repo fixture (deterministic, no downloads)
        run: bun run fixture --size small

      - name: Run tests
        run: bun test

      - name: PowerShell syntax
        run: |
          set -euo pipefail
          out="$(pwsh -NoProfile -File install.ps1 -Help)"
          grep -q "USAGE:" <<<"$out"
          pwsh -NoProfile -File install.ps1 -Targets=claude-code -DryRun >/dev/null

      - name: Build standalone binary
        run: bun run build

      - name: Verify packaged artifact
        run: |
          test -x dist/context
          ./dist/context --help >/dev/null
          # real parse exercises grammar discovery + wasm init (--help does not)
          cp -R tests/fixtures/multilang /tmp/ml && ./dist/context observe "MyClass" --root /tmp/ml >/dev/null

      - name: Smoke suite (compiled artifact, clean environment)
        run: bash scripts/build/smoke.sh ./dist/context

      - name: Smoke suite (installed launcher over the same artifact)
        run: |
          root="$(mktemp -d)"
          cp -R dist "$root/dist"
          cp -R skills "$root/skills"
          cp -R src scripts "$root/"
          bash scripts/build/mk-launcher.sh "$root" "$root/bin"
          bash scripts/build/smoke.sh "$root/bin/context"

      - name: Deterministic retrieval eval (fixture subset, no network)
        run: bun run eval
