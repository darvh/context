name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    # Linux/Windows targets cross-compile on the always-available Ubuntu
    # runner; darwin targets run on macOS because the embedded onnxruntime
    # addon needs install_name_tool (@executable_path) and the binary must be
    # ad-hoc signed or dyld SIGKILLs it.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: bun-linux-x64
            asset: linux-x64
            extension: ""
            vendor_platform: linux
            vendor_arch: x64
          - os: ubuntu-latest
            target: bun-linux-arm64
            asset: linux-arm64
            extension: ""
            vendor_platform: linux
            vendor_arch: arm64
          - os: ubuntu-latest
            target: bun-windows-x64
            asset: windows-x64
            extension: .exe
            vendor_platform: win32
            vendor_arch: x64
          - os: macos-14
            target: bun-darwin-arm64
            asset: darwin-arm64
            extension: ""
            vendor_platform: darwin
            vendor_arch: arm64
          - os: macos-14
            target: bun-darwin-x64
            asset: darwin-x64
            extension: ""
            vendor_platform: darwin
            vendor_arch: x64
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      TARGET: ${{ matrix.target }}
      ASSET: ${{ matrix.asset }}
      EXTENSION: ${{ matrix.extension }}
      VENDOR_PLATFORM: ${{ matrix.vendor_platform }}
      VENDOR_ARCH: ${{ matrix.vendor_arch }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate large-repo fixture (deterministic, no downloads)
        run: bun run fixture --size small

      - name: Run tests
        run: bun test

      - name: Embed grammar assets
        run: bun run scripts/build/embed-grammars.ts

      - name: Vendor onnxruntime for the target
        run: bun run scripts/build/vendor-onnx.ts --platform "$VENDOR_PLATFORM" --arch "$VENDOR_ARCH"

      - name: Stage runtime libraries
        run: bun run scripts/build/package.ts

      - name: Build target binary
        run: |
          mkdir -p "release/context/dist"
          # grammars + skill are embedded, so the ZIP is a self-contained
          # binary (matching `bun run build`); a standalone build resolves them
          # from bunfs, not a sibling directory.
          bun build --compile --target="$TARGET" --asset ./grammars --asset ./skills src/cli.ts --outfile "release/context/dist/context$EXTENSION"

      - name: Package, sign (macOS), and checksum
        run: bun run scripts/build/package-release.ts --tag "$RELEASE_TAG" --asset "$ASSET" --ext "$EXTENSION"

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: context-${{ matrix.asset }}
          path: |
            context-${{ env.RELEASE_TAG }}-${{ matrix.asset }}.zip
            context-${{ env.RELEASE_TAG }}-${{ matrix.asset }}.zip.sha256

  publish:
    needs: build
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: context-*
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            context-"$RELEASE_TAG"-*.zip \
            context-"$RELEASE_TAG"-*.zip.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --generate-notes
