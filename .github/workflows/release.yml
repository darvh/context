name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bun-linux-x64
            asset: linux-x64
            extension: ""
          - target: bun-linux-arm64
            asset: linux-arm64
            extension: ""
          - target: bun-darwin-x64
            asset: darwin-x64
            extension: ""
          - target: bun-darwin-arm64
            asset: darwin-arm64
            extension: ""
          - target: bun-windows-x64
            asset: windows-x64
            extension: .exe
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      TARGET: ${{ matrix.target }}
      ASSET: ${{ matrix.asset }}
      EXTENSION: ${{ matrix.extension }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test

      - name: Embed grammar assets
        run: bun run scripts/embed-grammars.ts

      - name: Package grammar assets
        run: bun run scripts/package.ts

      - name: Build target binary
        run: |
          mkdir -p "release/context/dist"
          bun build --compile --target="$TARGET" src/cli.ts --outfile "release/context/dist/context$EXTENSION"
          cp -R dist/grammars release/context/dist/grammars
          cp -R skill release/context/skill

      - name: Create ZIP and checksum
        run: |
          (cd release && zip -rq "../context-${RELEASE_TAG}-${ASSET}.zip" context)
          sha256sum "context-${RELEASE_TAG}-${ASSET}.zip" > "context-${RELEASE_TAG}-${ASSET}.zip.sha256"

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: context-${{ matrix.asset }}
          path: |
            context-${{ env.RELEASE_TAG }}-${{ matrix.asset }}.zip
            context-${{ env.RELEASE_TAG }}-${{ matrix.asset }}.zip.sha256

  publish:
    needs: build
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: context-*
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            context-"$RELEASE_TAG"-*.zip \
            context-"$RELEASE_TAG"-*.zip.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --generate-notes
