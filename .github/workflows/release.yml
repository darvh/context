name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bun-linux-x64
            asset: linux-x64
            extension: ""
            runtime_lib: true
          - target: bun-linux-arm64
            asset: linux-arm64
            extension: ""
            runtime_lib: false
          - target: bun-darwin-x64
            asset: darwin-x64
            extension: ""
            runtime_lib: false
          - target: bun-darwin-arm64
            asset: darwin-arm64
            extension: ""
            runtime_lib: false
          - target: bun-windows-x64
            asset: windows-x64
            extension: .exe
            runtime_lib: false
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      TARGET: ${{ matrix.target }}
      ASSET: ${{ matrix.asset }}
      EXTENSION: ${{ matrix.extension }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test

      - name: Embed grammar assets
        run: bun run scripts/embed-grammars.ts

      - name: Package grammar assets
        run: bun run scripts/package.ts

      - name: Build target binary
        run: |
          mkdir -p "release/context/dist"
          # grammars + skill are embedded so the release asset is one
          # self-contained binary (matching `bun run build`); the runtime does
          # not look for a sibling grammars/ directory from a standalone build.
          bun build --compile --target="$TARGET" --asset ./grammars --asset ./skills src/cli.ts --outfile "release/context/dist/context$EXTENSION"
          # the onnxruntime shared library cannot be embedded and must sit
          # beside the binary (dyld/ld.so @executable_path lookup). It is
          # host-specific, so only ship it where the build host matches the
          # target (linux-x64 today); elsewhere the semantic lane degrades.
          if [ "${{ matrix.runtime_lib }}" = "true" ]; then
            cp dist/libonnxruntime* release/context/dist/ 2>/dev/null || true
          fi
          # source is shipped too so the installed launcher can fall back to
          # `bun run src/cli.ts` when the host cannot execute compiled binaries
          cp -R src release/context/src
          cp -R scripts release/context/scripts
          cp -R skills/context release/context/skill
          cp package.json bun.lock release/context/

      - name: Create ZIP and checksum
        run: |
          (cd release && zip -rq "../context-${RELEASE_TAG}-${ASSET}.zip" context)
          sha256sum "context-${RELEASE_TAG}-${ASSET}.zip" > "context-${RELEASE_TAG}-${ASSET}.zip.sha256"

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: context-${{ matrix.asset }}
          path: |
            context-${{ env.RELEASE_TAG }}-${{ matrix.asset }}.zip
            context-${{ env.RELEASE_TAG }}-${{ matrix.asset }}.zip.sha256

  publish:
    needs: build
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: context-*
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            context-"$RELEASE_TAG"-*.zip \
            context-"$RELEASE_TAG"-*.zip.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --generate-notes
