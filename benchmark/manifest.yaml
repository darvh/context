# Context benchmark manifest (frozen Phase-0 fixture contract)
#
# See meta/cross-product/context-benchmark-plan.md and
# meta/cross-product/context-benchmark-acknowledgement.md.
#
# Every task runs each enabled arm with the same model, prompt, repo state,
# tool access, time limit, and retry policy. Golden locations are the expected
# "first relevant" source points; they drive recall metrics and are the same
# for every arm.

fixture_source: sample # spike fixtures only; real Phase-0 fixture (SWE-bench / TB 2.1 via harbor) pending

model:
  id: opencode-go/deepseek-v4-flash
  usage_multiplier: 2 # billed at 2x usage; applied to reported token counts
  timeout_seconds: 600
  permission: auto # auto-approve tool permissions (scripted, disposable fixtures)
  reps: 3
  # True cost schedule — DeepSeek V4 Flash (per 1M tokens):
  #   input cache miss $0.14, input cache hit $0.0028 (98% off), no cache-write fee.
  #   OUTPUT price is not in the stated schedule; adjust output_per_1m to the
  #   actual rate before publishing costs.
  pricing:
    input_miss_per_1m: 0.14
    input_hit_per_1m: 0.0028
    output_per_1m: 0.28
    cache_write_fee_per_1m: 0.0

arms:
  cold:
    label: agent + cold opencode
    enabled: true
  context:
    label: agent + Context structural capsule
    enabled: true
  graft-structural: # later: graft host arm over the SAME manifest
    label: agent + Graft structural
    enabled: false
  graft-deep:
    label: agent + Graft deep
    enabled: false
  context-semantic: # MVP 2
    label: agent + Context semantic retrieval
    enabled: false

# NOTE: sample tasks below use the spike fixtures to make the harness runnable.
# The real Phase-0 fixture (5 Graft-style + 5 Terminal-Bench 2.1 tasks, frozen
# revisions, golden expected locations) replaces these before any publication.
#
# Next fixture batch (context-benchmark-plan.md): 5 long Terminal-Bench 2.1
# tasks (exact task IDs + fixture revision recorded, discovery-heavy, not
# path-obvious), then a small SWE-bench follow-up once discovery metrics are
# stable. Example slot once a task is pinned:
#
#   - id: tb2.1-<task-id>
#     repo: git@github.com:owner/repo.git      # remote URLs are cloned; local dirs copied
#     revision: <git-sha>                       # exact pin; harness checks out and records it
#     prompt: "<task definition verbatim, unmodified>"
#     golden: ["<expected first-relevant location>"]
#     setup_cmd: "<terminal-bench setup script, run pre-agent>"   # optional
#     verify_cmd: <frozen test/check command>
#
# SWE-bench follow-up uses the same slot shape; record per-task failure cause
# (navigation/implementation/tests/environment) in failure-analysis.md.
tasks:
  - id: sess-go
    fixture: sample
    repo: spike/fixtures/go
    prompt: |
      Where is session persistence handled in this repository? Make the store
      survive restarts by adding a Flush method that persists the in-memory
      map, and call it from Close.
    golden:
      - "internal/session/store.go:18"
      - "internal/session/store.go:42"
      - "internal/session/store_test.go:6"
    verify_cmd: go test ./...
  - id: sess-ts
    fixture: sample
    repo: spike/fixtures/typescript
    prompt: |
      Where is session persistence handled in this repository? Add a clear
      method to the Store interface that wipes all entries, and implement it
      in both openStore and MemoryStore.
    golden:
      - "src/session/store.ts:7"
      - "src/session/store.ts:19"
      - "src/session/store.test.ts:5"
    verify_cmd: bun test
