# Official Terminal-Bench 2.1 fixture (frozen subset)
#
# Source of truth: https://github.com/harbor-framework/terminal-bench-2-1
# Runner: the Harbor framework (`harbor run --dataset terminal-bench/terminal-bench-2-1`),
# which pulls the task's Docker image, runs the agent in it, and runs the
# official verifier. Task definitions are used verbatim (instruction.md is the
# prompt; task.toml the container/verifier contract).
#
# Selection rule (context-benchmark-plan.md): discovery-heavy, many-file,
# costly tasks — not tasks answerable from a single path. Each row records
# provenance (dataset digest + image) for reproducibility.

model:
  id: opencode-go/deepseek-v4-flash
  usage_multiplier: 2
  dataset: terminal-bench/terminal-bench-2-1
  n_concurrent: 1 # docker + containerized opencode; keep serial per arm
  reps: 1         # official verifier cost is high; extend after first run

tasks:
  - name: crack-7z-hash
    difficulty: medium
    category: security
    image: alexgshaw/crack-7z-hash:20251031
    digest: sha256:99cbb2269f6bd112d3387fd01cb6900118fe4aded3f75a8d656580a8296a1ae5
    golden: ["/app/secrets/secret_file.txt"]
    why: password/archive cracking across many files; discovery of hash + archive layout
  - name: compile-compcert
    difficulty: medium
    category: system-administration
    image: alexgshaw/compile-compcert:20260403
    digest: sha256:22bde2a73d62fa46f5ab96f710561a72e8d1aa4266f008605a17f174622ad785
    golden: ["/tmp/CompCert"]
    why: build a verified C compiler from a huge multi-file source tree; heavy discovery
  - name: cancel-async-tasks
    difficulty: hard
    category: software-engineering
    image: alexgshaw/cancel-async-tasks:20251031
    digest: sha256:a3d048d351136e48070696cda8bb79660dfd74db1fea3b6da88559f0332699c1
    golden: []
    why: concurrent cancellation semantics; needs reading existing async scaffolding + tests
  - name: circuit-fibsqrt
    difficulty: hard
    category: software-engineering
    image: alexgshaw/circuit-fibsqrt:20251031
    digest: sha256:9bcffe1054bb33249aa578a9a2a74f3c8cca66b0cb7aa1328233f1d31822aae3
    golden: ["/app/sim.c"]
    why: logic-gate simulator across multiple C files and a gate spec; hard, file-heavy
  - name: build-pmars
    difficulty: medium
    category: software-engineering
    image: alexgshaw/build-pmars:20251031
    digest: sha256:63f0449b276f081986740c941ea9372068b310a02b062c1e5e3400f575241893
    golden: []
    why: build pMARS from source without X; build-system + Makefile discovery

arms:
  cold:
    label: harbor + opencode (deepseek-v4-flash)
    command: |
      harbor run --dataset terminal-bench/terminal-bench-2-1 \
        --include-task-name "terminal-bench/{crack-7z-hash,compile-compcert,cancel-async-tasks,circuit-fibsqrt,build-pmars}" \
        --agent opencode --model opencode-go/deepseek-v4-flash \
        --n-concurrent 1 -y --jobs-dir <out>/harbor-jobs
    enabled: true
  proof:
    label: harbor + opencode + Proof strategy (instruction-level; binary-in-container pending)
    enabled: true
  context: # capsule injection wrapper is WIP
    label: harbor + opencode + Context capsule
    enabled: false

# Notes
# - Requires Docker on the host; not present on the dev host, so this arm is
#   dry-run only here. Run on a docker-enabled host and record results in
#   benchmark/raw/harbor/<arm>/.
# - Primary metric is the OFFICIAL verifier pass/fail + wall time. Per-token
#   accounting from the containerized opencode is captured from job logs later.
